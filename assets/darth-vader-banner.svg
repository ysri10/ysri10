<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 184" width="100%" height="100%">
  <defs>
    <linearGradient id="appleSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="60%" stop-color="#161618" />
      <stop offset="100%" stop-color="#1c1c1e" />
    </linearGradient>

    <linearGradient id="topSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c" />
      <stop offset="50%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="saberCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd6d6" />
      <stop offset="100%" stop-color="#ff1a1a" />
    </linearGradient>

    <filter id="redSaberGlow" x="-150%" y="-50%" width="400%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .banner-root {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        fill: #86868b;
        letter-spacing: 1.6px;
      }
      .hero-name {
        font-size: 35px;
        font-weight: 700;
        fill: #f5f5f7;
        letter-spacing: -0.8px;
      }
      .hero-role {
        font-size: 15.5px;
        font-weight: 400;
        fill: #a1a1a6;
        letter-spacing: -0.1px;
      }
      .vader-group {
        cursor: pointer;
        animation: floatVader 3.6s ease-in-out infinite;
      }
      @keyframes floatVader {
        0%, 100% { transform: translate(836px, 14px); }
        50% { transform: translate(836px, 7px); }
      }
      .saber-blade {
        opacity: 0.14;
        transition: opacity 0.25s ease;
        animation: readmeSaberPulse 5.2s ease-in-out infinite;
      }
      @keyframes readmeSaberPulse {
        0%, 40%, 100% { opacity: 0.12; }
        55%, 75% { opacity: 1; }
      }
      .vader-group:hover .saber-blade {
        opacity: 1 !important;
        animation: none;
      }
      .chest-led-red {
        animation: blinkLed 1.5s infinite alternate;
      }
      .chest-led-green {
        animation: blinkLed 2.2s infinite alternate-reverse;
      }
      @keyframes blinkLed {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g class="banner-root">
    <!-- Apple Pro Dark Elevated Card -->
    <rect width="1000" height="184" rx="20" fill="url(#appleSurface)" stroke="#2c2c2e" stroke-width="1" />
    <line x1="20" y1="1" x2="980" y2="1" stroke="url(#topSpecular)" stroke-width="1" />

    <!-- Apple HIG Typography Hierarchy -->
    <text x="52" y="56" class="eyebrow">SOFTWARE ENGINEER II · DISH NETWORKS · PLANO, TX</text>
    <text x="52" y="102" class="hero-name">Sri Sai Srivatsa Yerrapragada</text>
    <text x="52" y="136" class="hero-role">Production AI Infrastructure, Multi-Agent LLM Platforms &amp; Distributed Systems</text>

    <!-- DARTH VADER ANIMATED CHARACTER (TOP RIGHT) -->
    <g class="vader-group" transform="translate(836, 14)">
      <ellipse cx="56" cy="154" rx="32" ry="4.5" fill="#000000" opacity="0.55" />

      <!-- Cape -->
      <path d="M22,82 Q11,120 15,148 L97,148 Q101,120 90,82 Z" fill="#0b0b0d" stroke="#2c2c2e" stroke-width="1.1" />

      <!-- Torso Armor -->
      <path d="M26,84 Q56,73 86,84 L80,142 L32,142 Z" fill="#161618" stroke="#3a3a3c" stroke-width="1.1" />

      <!-- Chest Control Panel -->
      <rect x="43" y="99" width="26" height="24" rx="2.5" fill="#0d0d0f" stroke="#48484a" stroke-width="1" />
      <rect class="chest-led-red" x="47" y="104" width="5" height="5" rx="1" fill="#ff3b30" />
      <rect class="chest-led-green" x="47" y="113" width="5" height="5" rx="1" fill="#30d158" />
      <rect x="55" y="104" width="10" height="3.2" rx="1" fill="#0a84ff" opacity="0.85" />
      <rect x="55" y="110" width="10" height="3.2" rx="1" fill="#8e8e93" opacity="0.65" />
      <rect x="55" y="116" width="10" height="3.2" rx="1" fill="#ff9f0a" opacity="0.8" />

      <!-- Belt -->
      <rect x="30" y="129" width="52" height="7" rx="1.5" fill="#09090b" stroke="#3a3a3c" />
      <rect x="49" y="127" width="14" height="11" rx="1.5" fill="#8e8e93" />

      <!-- Helmet -->
      <path d="M18,70 Q20,18 56,18 Q92,18 94,70 L100,81 Q56,89 12,81 Z" fill="url(#helmetGrad)" stroke="#48484a" stroke-width="1.2" />
      <path d="M54,18 L58,18 L59,54 L53,54 Z" fill="#636366" opacity="0.6" />
      <path d="M24,54 Q56,46 88,54" fill="none" stroke="#636366" stroke-width="1.8" />

      <!-- Eye Lenses -->
      <ellipse cx="42" cy="59" rx="9.5" ry="5.2" transform="rotate(-8 42 59)" fill="#050507" stroke="#48484a" stroke-width="1.1" />
      <ellipse cx="70" cy="59" rx="9.5" ry="5.2" transform="rotate(8 70 59)" fill="#050507" stroke="#48484a" stroke-width="1.1" />
      <ellipse cx="39" cy="57" rx="3.2" ry="1.2" transform="rotate(-8 39 57)" fill="#aeaeb2" opacity="0.45" />
      <ellipse cx="67" cy="57" rx="3.2" ry="1.2" transform="rotate(8 67 57)" fill="#aeaeb2" opacity="0.45" />

      <!-- Breathing Mask -->
      <polygon points="56,63 43,79 69,79" fill="#1c1c1e" stroke="#636366" stroke-width="1.1" />
      <line x1="56" y1="65" x2="56" y2="78" stroke="#09090b" stroke-width="1.4" />
      <line x1="51" y1="69" x2="51" y2="78" stroke="#09090b" stroke-width="1.3" />
      <line x1="61" y1="69" x2="61" y2="78" stroke="#09090b" stroke-width="1.3" />

      <!-- Arm & Lightsaber -->
      <path d="M82,90 L102,108 L95,116 L76,99 Z" fill="#1c1c1e" stroke="#3a3a3c" />
      <g transform="translate(102, 110) rotate(-12)">
        <rect x="-3.6" y="-11" width="7.2" height="22" rx="1.8" fill="#aeaeb2" stroke="#1c1c1e" stroke-width="1" />
        <rect x="-4" y="-5" width="8" height="3.5" fill="#1c1c1e" />
        <rect x="-4" y="2" width="8" height="5" fill="#1c1c1e" />
        <circle cx="0" cy="-8" r="1.4" fill="#ff3b30" />

        <!-- Crimson Blade -->
        <g class="saber-blade">
          <rect x="-5" y="-102" width="10" height="92" rx="5" fill="#ff0000" opacity="0.82" filter="url(#redSaberGlow)" />
          <rect x="-2.2" y="-100" width="4.4" height="89" rx="2.2" fill="url(#saberCore)" />
        </g>
      </g>
    </g>
  </g>
</svg>
