<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="65%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#14090c" />
    </linearGradient>

    <radialGradient id="sithAura" cx="88%" cy="48%" r="24%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.08;0.26;0.08" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1017" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343942" />
      <stop offset="50%" stop-color="#171a20" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <linearGradient id="saberCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd6d6" />
      <stop offset="100%" stop-color="#ff1a1a" />
    </linearGradient>

    <filter id="redSaberGlow" x="-150%" y="-50%" width="400%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .banner-root {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        fill: #7d8590;
        letter-spacing: 2px;
      }
      .hero-name {
        font-size: 32px;
        font-weight: 700;
        fill: #f0f6fc;
        letter-spacing: -0.6px;
      }
      .hero-role {
        font-size: 15px;
        font-weight: 500;
        fill: #c9d1d9;
      }
      .hero-sub {
        font-size: 13px;
        fill: #7d8590;
      }
      .metric-box {
        fill: rgba(255, 255, 255, 0.025);
        stroke: #21262d;
        stroke-width: 1;
      }
      .metric-text {
        font-size: 11.5px;
        font-weight: 500;
        fill: #8b949e;
      }
      .vader-group {
        cursor: pointer;
        animation: floatVader 3.4s ease-in-out infinite;
      }
      @keyframes floatVader {
        0%, 100% { transform: translate(835px, 24px); }
        50% { transform: translate(835px, 17px); }
      }
      .saber-blade {
        opacity: 0.15;
        transition: opacity 0.25s ease;
        animation: readmeSaberPulse 5s ease-in-out infinite;
      }
      @keyframes readmeSaberPulse {
        0%, 38%, 100% { opacity: 0.12; }
        52%, 78% { opacity: 1; }
      }
      .vader-group:hover .saber-blade {
        opacity: 1 !important;
        animation: none;
      }
      .chest-led-red {
        animation: blinkLed 1.4s infinite alternate;
      }
      .chest-led-green {
        animation: blinkLed 2.1s infinite alternate-reverse;
      }
      @keyframes blinkLed {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g class="banner-root">
    <!-- Minimalist Framed Surface -->
    <rect width="1000" height="220" rx="14" fill="url(#bgGrad)" stroke="#1f242c" stroke-width="1.5" />
    <rect width="1000" height="220" rx="14" fill="url(#sithAura)" />

    <!-- Subtle Hairline Divider -->
    <line x1="48" y1="154" x2="760" y2="154" stroke="#1f242c" stroke-width="1" />

    <!-- Minimal Typography Block -->
    <text x="48" y="48" class="eyebrow">SOFTWARE ENGINEER II · DISH NETWORKS · PLANO, TX</text>
    <text x="48" y="92" class="hero-name">Sri Sai Srivatsa Yerrapragada</text>
    <text x="48" y="124" class="hero-role">Production AI Infrastructure, Multi-Agent LLM Platforms &amp; Distributed Systems</text>

    <!-- Minimalist Metric Pills (No Emojis) -->
    <g transform="translate(48, 170)">
      <rect class="metric-box" width="168" height="26" rx="5" />
      <text x="84" y="17" text-anchor="middle" class="metric-text">50M+ Vector Index</text>

      <rect class="metric-box" x="180" width="184" height="26" rx="5" />
      <text x="272" y="17" text-anchor="middle" class="metric-text">1M+ Daily Queries (&lt;150ms)</text>

      <rect class="metric-box" x="376" width="176" height="26" rx="5" />
      <text x="464" y="17" text-anchor="middle" class="metric-text">3x AWS Certified</text>
    </g>

    <!-- DARTH VADER ANIMATED CHARACTER (TOP RIGHT) -->
    <g class="vader-group" transform="translate(835, 24)">
      <ellipse cx="56" cy="160" rx="34" ry="5" fill="#000000" opacity="0.55" />

      <!-- Cape -->
      <path d="M22,82 Q11,122 15,154 L97,154 Q101,122 90,82 Z" fill="#0b0c10" stroke="#22262e" stroke-width="1.1" />

      <!-- Torso Armor -->
      <path d="M26,84 Q56,73 86,84 L80,146 L32,146 Z" fill="#14171d" stroke="#2b303c" stroke-width="1.1" />

      <!-- Chest Control Panel -->
      <rect x="43" y="99" width="26" height="24" rx="2.5" fill="#0c0e12" stroke="#363c4a" stroke-width="1" />
      <rect class="chest-led-red" x="47" y="104" width="5" height="5" rx="1" fill="#ff2e2e" />
      <rect class="chest-led-green" x="47" y="113" width="5" height="5" rx="1" fill="#3fb950" />
      <rect x="55" y="104" width="10" height="3.2" rx="1" fill="#58a6ff" opacity="0.85" />
      <rect x="55" y="110" width="10" height="3.2" rx="1" fill="#8b949e" opacity="0.6" />
      <rect x="55" y="116" width="10" height="3.2" rx="1" fill="#d29922" opacity="0.75" />

      <!-- Belt -->
      <rect x="30" y="130" width="52" height="7" rx="1.5" fill="#090a0d" stroke="#2b303c" />
      <rect x="49" y="128" width="14" height="11" rx="1.5" fill="#8b949e" />

      <!-- Helmet -->
      <path d="M18,70 Q20,18 56,18 Q92,18 94,70 L100,81 Q56,89 12,81 Z" fill="url(#helmetGrad)" stroke="#363c4a" stroke-width="1.2" />
      <path d="M54,18 L58,18 L59,54 L53,54 Z" fill="#484f58" opacity="0.65" />
      <path d="M24,54 Q56,46 88,54" fill="none" stroke="#484f58" stroke-width="1.8" />

      <!-- Eye Lenses -->
      <ellipse cx="42" cy="59" rx="9.5" ry="5.2" transform="rotate(-8 42 59)" fill="#050608" stroke="#484f58" stroke-width="1.1" />
      <ellipse cx="70" cy="59" rx="9.5" ry="5.2" transform="rotate(8 70 59)" fill="#050608" stroke="#484f58" stroke-width="1.1" />
      <ellipse cx="39" cy="57" rx="3.2" ry="1.2" transform="rotate(-8 39 57)" fill="#8b949e" opacity="0.45" />
      <ellipse cx="67" cy="57" rx="3.2" ry="1.2" transform="rotate(8 67 57)" fill="#8b949e" opacity="0.45" />

      <!-- Breathing Mask -->
      <polygon points="56,63 43,79 69,79" fill="#1c2028" stroke="#484f58" stroke-width="1.1" />
      <line x1="56" y1="65" x2="56" y2="78" stroke="#090a0d" stroke-width="1.4" />
      <line x1="51" y1="69" x2="51" y2="78" stroke="#090a0d" stroke-width="1.3" />
      <line x1="61" y1="69" x2="61" y2="78" stroke="#090a0d" stroke-width="1.3" />

      <!-- Arm & Lightsaber -->
      <path d="M82,90 L102,108 L95,116 L76,99 Z" fill="#181c24" stroke="#2b303c" />
      <g transform="translate(102, 110) rotate(-12)">
        <rect x="-3.6" y="-11" width="7.2" height="22" rx="1.8" fill="#9ca3af" stroke="#1f2937" stroke-width="1" />
        <rect x="-4" y="-5" width="8" height="3.5" fill="#111827" />
        <rect x="-4" y="2" width="8" height="5" fill="#111827" />
        <circle cx="0" cy="-8" r="1.4" fill="#ff1a1a" />

        <!-- Crimson Blade -->
        <g class="saber-blade">
          <rect x="-5" y="-102" width="10" height="92" rx="5" fill="#ff0000" opacity="0.8" filter="url(#redSaberGlow)" />
          <rect x="-2.2" y="-100" width="4.4" height="89" rx="2.2" fill="url(#saberCore)" />
        </g>
      </g>

      <text x="56" y="174" text-anchor="middle" font-size="9" font-weight="600" fill="#6e7681" letter-spacing="1.2">INTERACTIVE MODE</text>
    </g>
  </g>
</svg>
