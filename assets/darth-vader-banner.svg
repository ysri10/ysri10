<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="55%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#17080c" />
    </linearGradient>

    <radialGradient id="sithAura" cx="85%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.28">
        <animate attributeName="stop-opacity" values="0.12;0.34;0.12" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343942" />
      <stop offset="45%" stop-color="#181b20" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <linearGradient id="saberCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd6d6" />
      <stop offset="100%" stop-color="#ff1e1e" />
    </linearGradient>

    <filter id="redSaberGlow" x="-150%" y="-50%" width="400%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .banner-root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .grid-line {
        stroke: rgba(255, 255, 255, 0.035);
        stroke-width: 1;
      }
      .hero-name {
        font-size: 32px;
        font-weight: 800;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .hero-role {
        font-size: 15px;
        font-weight: 600;
        fill: #58a6ff;
      }
      .hero-sub {
        font-size: 13px;
        fill: #8b949e;
      }
      .pill-bg {
        fill: rgba(255, 30, 30, 0.12);
        stroke: rgba(255, 59, 59, 0.45);
        stroke-width: 1;
      }
      .pill-text {
        font-size: 11px;
        font-weight: 700;
        fill: #ff6b6b;
        letter-spacing: 0.6px;
      }
      .vader-group {
        cursor: pointer;
        animation: floatVader 3.2s ease-in-out infinite;
      }
      @keyframes floatVader {
        0%, 100% { transform: translate(825px, 28px); }
        50% { transform: translate(825px, 20px); }
      }
      /* Lightsaber blade idle pulse in README + instant full glow on direct SVG hover */
      .saber-blade {
        opacity: 0.25;
        transition: opacity 0.25s ease, transform 0.25s ease;
        animation: readmeSaberPulse 5s ease-in-out infinite;
      }
      @keyframes readmeSaberPulse {
        0%, 35%, 100% { opacity: 0.18; }
        50%, 80% { opacity: 1; }
      }
      .vader-group:hover .saber-blade {
        opacity: 1 !important;
        animation: none;
      }
      .chest-led-red {
        animation: blinkLed 1.4s infinite alternate;
      }
      .chest-led-green {
        animation: blinkLed 2.1s infinite alternate-reverse;
      }
      @keyframes blinkLed {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g class="banner-root">
    <!-- Outer Card Frame -->
    <rect width="1000" height="230" rx="16" fill="url(#bgGrad)" stroke="#21262d" stroke-width="2" />
    <rect width="1000" height="230" rx="16" fill="url(#sithAura)" />

    <!-- Subtle Cyber Grid -->
    <line class="grid-line" x1="0" y1="55" x2="1000" y2="55" />
    <line class="grid-line" x1="0" y1="115" x2="1000" y2="115" />
    <line class="grid-line" x1="0" y1="175" x2="1000" y2="175" />
    <line class="grid-line" x1="250" y1="0" x2="250" y2="230" />
    <line class="grid-line" x1="500" y1="0" x2="500" y2="230" />
    <line class="grid-line" x1="750" y1="0" x2="750" y2="230" />

    <!-- Starfield Particles -->
    <circle cx="90" cy="34" r="1.2" fill="#ffffff" opacity="0.45" />
    <circle cx="420" cy="28" r="1.5" fill="#58a6ff" opacity="0.5" />
    <circle cx="670" cy="42" r="1.2" fill="#ff4d4d" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="190" r="1.4" fill="#ff4d4d" opacity="0.5" />
    <circle cx="955" cy="38" r="1.3" fill="#ffffff" opacity="0.5" />

    <!-- Top Status Pill -->
    <g transform="translate(42, 32)">
      <rect class="pill-bg" width="352" height="24" rx="12" />
      <circle cx="14" cy="12" r="4" fill="#ff3b3b">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="16" class="pill-text">SITH TELEMETRY ONLINE · CLICK VADER FOR TORCH MODE</text>
    </g>

    <!-- Name & Headline -->
    <text x="42" y="100" class="hero-name">Sri Sai Srivatsa Yerrapragada</text>
    <text x="42" y="132" class="hero-role">Software Engineer II @ Dish Networks · AI Infrastructure &amp; Distributed Systems</text>
    <text x="42" y="162" class="hero-sub">⚡ Multi-Agent LLM Platforms (Temporal + Bedrock) · 50M+ Vector RAG · Multi-GPU PyTorch DDP</text>

    <!-- Metric Chips -->
    <g transform="translate(42, 180)">
      <rect width="155" height="26" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="12" y="17" font-size="11.5" fill="#c9d1d9" font-weight="600">🔥 1M+ Queries/Day</text>

      <rect x="167" width="160" height="26" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="179" y="17" font-size="11.5" fill="#c9d1d9" font-weight="600">⚡ &lt;150ms P99 RAG</text>

      <rect x="339" width="165" height="26" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="351" y="17" font-size="11.5" fill="#c9d1d9" font-weight="600">☁️ 3x AWS Certified</text>
    </g>

    <!-- DARTH VADER ANIMATED CHARACTER (TOP RIGHT) -->
    <g class="vader-group" transform="translate(825, 28)">
      <!-- Shadow Base -->
      <ellipse cx="58" cy="168" rx="38" ry="6" fill="#000000" opacity="0.55" />

      <!-- Flowing Sith Cape -->
      <path d="M22,82 Q10,126 14,162 L102,162 Q106,126 94,82 Z" fill="#0b0c10" stroke="#22262e" stroke-width="1.2" />

      <!-- Torso & Shoulder Armor -->
      <path d="M26,84 Q58,72 90,84 L84,152 L32,152 Z" fill="#15181e" stroke="#2f3540" stroke-width="1.2" />
      <path d="M26,84 Q58,76 90,84 L86,96 Q58,88 30,96 Z" fill="#252a34" />

      <!-- Chest Life-Support Control Box -->
      <rect x="44" y="102" width="28" height="26" rx="3" fill="#0d0f13" stroke="#3b4252" stroke-width="1.2" />
      <rect class="chest-led-red" x="48" y="107" width="6" height="6" rx="1" fill="#ff2e2e" />
      <rect class="chest-led-green" x="48" y="117" width="6" height="6" rx="1" fill="#2ea043" />
      <rect x="57" y="107" width="11" height="4" rx="1" fill="#58a6ff" opacity="0.85" />
      <rect x="57" y="114" width="11" height="4" rx="1" fill="#8b949e" opacity="0.6" />
      <rect x="57" y="121" width="11" height="4" rx="1" fill="#d29922" opacity="0.8" />

      <!-- Belt & Buckle -->
      <rect x="31" y="134" width="54" height="8" rx="2" fill="#090a0d" stroke="#30363d" stroke-width="1" />
      <rect x="51" y="132" width="14" height="12" rx="2" fill="#8b949e" />
      <circle cx="40" cy="138" r="2.2" fill="#ff2e2e" />
      <circle cx="76" cy="138" r="2.2" fill="#ff2e2e" />

      <!-- Iconic Darth Vader Helmet Dome & Flare -->
      <path d="M18,68 Q20,14 58,14 Q96,14 98,68 L104,80 Q58,88 12,80 Z" fill="url(#helmetGrad)" stroke="#3b4252" stroke-width="1.3" />
      <!-- Center Helmet Ridge -->
      <path d="M56,14 L60,14 L61,52 L55,52 Z" fill="#484f58" opacity="0.7" />
      <!-- Helmet Rim Brow -->
      <path d="M24,52 Q58,44 92,52" fill="none" stroke="#484f58" stroke-width="2" />

      <!-- Optical Eye Lenses -->
      <ellipse cx="44" cy="57" rx="10" ry="5.5" transform="rotate(-8 44 57)" fill="#050608" stroke="#484f58" stroke-width="1.2" />
      <ellipse cx="72" cy="57" rx="10" ry="5.5" transform="rotate(8 72 57)" fill="#050608" stroke="#484f58" stroke-width="1.2" />
      <!-- Lens Glint -->
      <ellipse cx="41" cy="55" rx="3.5" ry="1.4" transform="rotate(-8 41 55)" fill="#8b949e" opacity="0.45" />
      <ellipse cx="69" cy="55" rx="3.5" ry="1.4" transform="rotate(8 69 55)" fill="#8b949e" opacity="0.45" />

      <!-- Triangular Vocoder / Breathing Mask -->
      <polygon points="58,61 44,78 72,78" fill="#1f242c" stroke="#586069" stroke-width="1.2" />
      <line x1="58" y1="63" x2="58" y2="77" stroke="#0d1117" stroke-width="1.5" />
      <line x1="53" y1="67" x2="53" y2="77" stroke="#0d1117" stroke-width="1.4" />
      <line x1="63" y1="67" x2="63" y2="77" stroke="#0d1117" stroke-width="1.4" />
      <circle cx="44" cy="78" r="2.2" fill="#8b949e" />
      <circle cx="72" cy="78" r="2.2" fill="#8b949e" />

      <!-- Right Arm & Lightsaber Hilt -->
      <path d="M85,92 L106,112 L98,120 L78,102 Z" fill="#1b1f27" stroke="#30363d" />
      <!-- Lightsaber Hilt -->
      <g transform="translate(105, 114) rotate(-14)">
        <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#8b949e" stroke="#21262d" stroke-width="1" />
        <rect x="-4.5" y="-6" width="9" height="4" fill="#161b22" />
        <rect x="-4.5" y="2" width="9" height="6" fill="#161b22" />
        <circle cx="0" cy="-9" r="1.5" fill="#ff1e1e" />

        <!-- Crimson Lightsaber Blade (Glows Red!) -->
        <g class="saber-blade">
          <rect x="-5" y="-112" width="10" height="102" rx="5" fill="#ff0000" opacity="0.75" filter="url(#redSaberGlow)" />
          <rect x="-2.2" y="-110" width="4.4" height="98" rx="2.2" fill="url(#saberCore)" />
        </g>
      </g>

      <!-- Label Badge Beneath Vader -->
      <rect x="6" y="164" width="104" height="20" rx="10" fill="#1a0b0e" stroke="#ff3b3b" stroke-width="1" />
      <text x="58" y="178" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ff7b72">⚔️ HOVER / CLICK ME</text>
    </g>
  </g>
</svg>
